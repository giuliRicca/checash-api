services:
  - type: web
    name: checash-api
    runtime: python
    rootDir: .
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EXCHANGE_RATE_PROVIDER_BASE_URL
        value: https://dolarapi.com/v1
      - key: EXCHANGE_RATE_TTL_SECONDS
        value: "3600"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
